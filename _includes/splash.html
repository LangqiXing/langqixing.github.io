<div id="lx-splash" class="lx-splash" aria-hidden="true" hidden>
  <button class="lx-splash__skip" type="button" data-splash-skip aria-label="Skip intro"><span lang="en">Skip →</span><span lang="zh">跳过 →</span></button>
  <div class="lx-splash__stage">
    <svg class="lx-splash__art" viewBox="0 0 640 400" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="A hand-drawn sketch of a microfluidic channel, particles, droplet, and beacon — elements of Langqi's research.">
      <defs>
        <filter id="lxRough" x="-10%" y="-10%" width="120%" height="120%">
          <feTurbulence type="fractalNoise" baseFrequency="0.022" numOctaves="2" seed="7"/>
          <feDisplacementMap in="SourceGraphic" scale="2.2"/>
        </filter>
        <linearGradient id="lxBeacon" x1="0" y1="0" x2="1" y2="1">
          <stop offset="0%" stop-color="#2f7d7a" stop-opacity="0.7"/>
          <stop offset="100%" stop-color="#b6892c" stop-opacity="0.4"/>
        </linearGradient>
      </defs>

      <g filter="url(#lxRough)" fill="none" stroke="#1f2a30" stroke-linecap="round" stroke-linejoin="round">

        <!-- Dead-end microfluidic channel (research focus) -->
        <path class="lx-line lx-line--1" d="M40 220 Q80 218 160 220 Q260 222 320 210 L360 210 L360 250 L320 250 Q260 252 160 250 Q80 252 40 250 Z"
              stroke-width="2.4"/>

        <!-- Particles flowing in -->
        <circle class="lx-line lx-line--2" cx="80" cy="232" r="6" stroke-width="2"/>
        <circle class="lx-line lx-line--2" cx="110" cy="240" r="4" stroke-width="2"/>
        <circle class="lx-line lx-line--2" cx="138" cy="226" r="5" stroke-width="2"/>
        <circle class="lx-line lx-line--2" cx="175" cy="236" r="4" stroke-width="2"/>
        <circle class="lx-line lx-line--3" cx="212" cy="228" r="5" stroke-width="2"/>
        <circle class="lx-line lx-line--3" cx="248" cy="238" r="3" stroke-width="2"/>
        <circle class="lx-line lx-line--3" cx="284" cy="230" r="4" stroke-width="2"/>

        <!-- Arrow showing flow direction -->
        <path class="lx-line lx-line--2" d="M16 235 L40 230 M16 235 L40 240" stroke-width="2"/>

        <!-- Beacon (hydrogel chemical gradient) — radiating arcs -->
        <g transform="translate(490 150)">
          <circle class="lx-line lx-line--4" cx="0" cy="0" r="14" stroke="url(#lxBeacon)" stroke-width="2.4" fill="#fff4d1" fill-opacity="0.45"/>
          <circle class="lx-line lx-line--4" cx="0" cy="0" r="32" stroke-width="1.6" stroke-opacity="0.6" stroke-dasharray="3 4"/>
          <circle class="lx-line lx-line--5" cx="0" cy="0" r="52" stroke-width="1.4" stroke-opacity="0.45" stroke-dasharray="2 5"/>
          <circle class="lx-line lx-line--5" cx="0" cy="0" r="74" stroke-width="1.2" stroke-opacity="0.3" stroke-dasharray="2 6"/>
        </g>

        <!-- Droplet -->
        <path class="lx-line lx-line--3" d="M150 110 C 132 130, 132 154, 150 168 C 168 154, 168 130, 150 110 Z"
              stroke-width="2.2" fill="#2f7d7a" fill-opacity="0.08"/>

        <!-- Pipette tip dripping -->
        <path class="lx-line lx-line--2" d="M134 56 L150 100 L166 56 Z" stroke-width="2"/>
        <path class="lx-line lx-line--2" d="M134 56 L166 56" stroke-width="2"/>
        <circle class="lx-line lx-line--3" cx="150" cy="116" r="2.4" stroke-width="2" fill="#2f7d7a" fill-opacity="0.35"/>

        <!-- Blood vessel curve — sketchy meander -->
        <path class="lx-line lx-line--5" d="M380 320 C 420 300, 470 340, 510 314 S 580 296, 612 318"
              stroke-width="3" stroke-opacity="0.65"/>
        <path class="lx-line lx-line--5" d="M380 332 C 420 312, 470 352, 510 326 S 580 308, 612 330"
              stroke-width="3" stroke-opacity="0.65"/>

        <!-- Tiny cells inside vessel -->
        <ellipse class="lx-line lx-line--6" cx="430" cy="320" rx="6" ry="4" stroke-width="1.5" fill="#c9543f" fill-opacity="0.25"/>
        <ellipse class="lx-line lx-line--6" cx="470" cy="328" rx="6" ry="4" stroke-width="1.5" fill="#c9543f" fill-opacity="0.25"/>
        <ellipse class="lx-line lx-line--6" cx="540" cy="316" rx="6" ry="4" stroke-width="1.5" fill="#c9543f" fill-opacity="0.25"/>

        <!-- Annotations -->
        <text class="lx-text lx-text--1" x="200" y="92" font-family="Georgia, serif" font-style="italic" font-size="14" fill="#1f2a30" stroke="none">
          <tspan lang="en">drug delivery</tspan><tspan lang="zh">药物输运</tspan>
        </text>
        <text class="lx-text lx-text--2" x="400" y="120" font-family="Georgia, serif" font-style="italic" font-size="14" fill="#1f2a30" stroke="none">
          <tspan lang="en">hydrogel beacon</tspan><tspan lang="zh">水凝胶信标</tspan>
        </text>
        <text class="lx-text lx-text--3" x="20" y="200" font-family="Georgia, serif" font-style="italic" font-size="14" fill="#1f2a30" stroke="none">
          <tspan lang="en">particles</tspan><tspan lang="zh">颗粒</tspan>
        </text>
        <text class="lx-text lx-text--4" x="430" y="372" font-family="Georgia, serif" font-style="italic" font-size="14" fill="#1f2a30" stroke="none">
          <tspan lang="en">microvasculature</tspan><tspan lang="zh">微血管</tspan>
        </text>
      </g>
    </svg>

      <h1 class="lx-splash__title">
        <span lang="en">Langqi Xing</span>

        <span lang="en">Microfluidics &middot; Particle Transport &middot; Hydrogel Beacons</span>
        <span lang="zh">微流控 · 颗粒输运 · 水凝胶信标</span>
      </p>
      <p class="lx-splash__hint">
        <span lang="en">click anywhere, scroll, or press <kbd>Esc</kbd></span>
        <span lang="zh">点击任意处、滚动，或按 <kbd>Esc</kbd></span>
      </p>
    </div>
  </div>
  <div class="lx-splash__progress" aria-hidden="true">

</div>
