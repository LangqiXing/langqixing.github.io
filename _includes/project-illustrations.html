{% comment %}
  Inline SVG illustration for the No-Scrub Window Cleaner project.
  The other three projects use real images dropped into /images/projects/.
  Usage: {% include project-illustrations.html topic="window-cleaner" %}
{% endcomment %}

{% if include.topic == "window-cleaner" %}
<svg class="project-art" viewBox="0 0 220 150" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
  <defs>
    <linearGradient id="wcGlass" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#dfeaee" stop-opacity="0.55"/>
      <stop offset="100%" stop-color="#a5c5cf" stop-opacity="0.25"/>
    </linearGradient>
    <radialGradient id="wcFoam" cx="35%" cy="35%" r="70%">
      <stop offset="0%" stop-color="#fff" stop-opacity="0.95"/>
      <stop offset="100%" stop-color="#fff" stop-opacity="0.55"/>
    </radialGradient>
  </defs>

  <!-- Building silhouette on the left -->
  <rect x="0" y="14" width="34" height="130" fill="#1f2a30" opacity="0.88"/>
  <g fill="#fff4d1" opacity="0.75">
    <rect x="6" y="22" width="6" height="6"/>
    <rect x="16" y="22" width="6" height="6"/>
    <rect x="26" y="22" width="6" height="6"/>
    <rect x="6" y="34" width="6" height="6"/>
    <rect x="16" y="34" width="6" height="6"/>
    <rect x="26" y="34" width="6" height="6"/>
    <rect x="6" y="46" width="6" height="6"/>
    <rect x="16" y="46" width="6" height="6"/>
    <rect x="26" y="46" width="6" height="6"/>
    <rect x="6" y="58" width="6" height="6"/>
    <rect x="16" y="58" width="6" height="6"/>
    <rect x="26" y="58" width="6" height="6"/>
    <rect x="6" y="70" width="6" height="6"/>
    <rect x="16" y="70" width="6" height="6"/>
    <rect x="26" y="70" width="6" height="6"/>
    <rect x="6" y="82" width="6" height="6"/>
    <rect x="16" y="82" width="6" height="6"/>
    <rect x="26" y="82" width="6" height="6"/>
    <rect x="6" y="94" width="6" height="6"/>
    <rect x="16" y="94" width="6" height="6"/>
    <rect x="26" y="94" width="6" height="6"/>
    <rect x="6" y="106" width="6" height="6"/>
    <rect x="16" y="106" width="6" height="6"/>
    <rect x="26" y="106" width="6" height="6"/>
  </g>

  <!-- Cross-section of one window pane (right of building) -->
  <rect x="44" y="22" width="166" height="106" fill="url(#wcGlass)" stroke="#1f2a30" stroke-width="1.2"/>

  <!-- Foam layer near the top -->
  <g stroke="#2f7d7a" stroke-width="0.7">
    <circle cx="58" cy="38" r="4" fill="url(#wcFoam)"/>
    <circle cx="68" cy="34" r="3" fill="url(#wcFoam)"/>
    <circle cx="80" cy="40" r="4.5" fill="url(#wcFoam)"/>
    <circle cx="92" cy="36" r="3.4" fill="url(#wcFoam)"/>
    <circle cx="104" cy="40" r="3.8" fill="url(#wcFoam)"/>
    <circle cx="116" cy="35" r="3.2" fill="url(#wcFoam)"/>
    <circle cx="128" cy="38" r="4.2" fill="url(#wcFoam)"/>
    <circle cx="142" cy="34" r="3" fill="url(#wcFoam)"/>
    <circle cx="156" cy="39" r="3.6" fill="url(#wcFoam)"/>
    <circle cx="170" cy="36" r="3.2" fill="url(#wcFoam)"/>
    <circle cx="184" cy="40" r="4" fill="url(#wcFoam)"/>
    <circle cx="198" cy="36" r="3.4" fill="url(#wcFoam)"/>
  </g>

  <!-- Dust particles being lifted in the middle band -->
  <g fill="#b6892c">
    <circle cx="64" cy="64" r="1.6"/>
    <circle cx="78" cy="68" r="1.1"/>
    <circle cx="90" cy="62" r="1.8"/>
    <circle cx="104" cy="66" r="1.3"/>
    <circle cx="116" cy="70" r="1.5"/>
    <circle cx="128" cy="63" r="1.2"/>
    <circle cx="140" cy="67" r="1.6"/>
    <circle cx="154" cy="62" r="1.2"/>
    <circle cx="166" cy="66" r="1.8"/>
    <circle cx="180" cy="64" r="1.4"/>
    <circle cx="194" cy="68" r="1.6"/>
  </g>

  <!-- Up arrows showing the lift action -->
  <g fill="none" stroke="#c9543f" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round" opacity="0.78">
    <path d="M84 94 L84 80 M78 86 L84 80 L90 86"/>
    <path d="M120 96 L120 82 M114 88 L120 82 L126 88"/>
    <path d="M156 94 L156 80 M150 86 L156 80 L162 86"/>
  </g>

  <!-- Water beads on hydrophobic-coated glass at the bottom -->
  <g fill="#2f7d7a" fill-opacity="0.7" stroke="#1f2a30" stroke-width="0.6">
    <ellipse cx="58" cy="110" rx="4.5" ry="3.4"/>
    <ellipse cx="76" cy="112" rx="3" ry="2.4"/>
    <ellipse cx="92" cy="110" rx="5" ry="3.8"/>
    <ellipse cx="112" cy="112" rx="3.2" ry="2.8"/>
    <ellipse cx="130" cy="110" rx="4" ry="3.2"/>
    <ellipse cx="150" cy="112" rx="3.4" ry="2.8"/>
    <ellipse cx="170" cy="110" rx="4.2" ry="3.4"/>
    <ellipse cx="190" cy="112" rx="3" ry="2.4"/>
  </g>

  <!-- Glass surface baseline -->
  <line x1="44" y1="118" x2="210" y2="118" stroke="#1f2a30" stroke-width="1.2"/>

  <!-- Top label -->
  <text x="127" y="16" text-anchor="middle" font-family="Georgia, serif" font-style="italic" font-size="11" fill="#1f2a30">foam → lifted dust → hydrophobic glass</text>

  <!-- Floor label -->
  <text x="127" y="138" text-anchor="middle" font-family="Georgia, serif" font-style="italic" font-size="10" fill="#b6892c">no scrubbing required</text>
</svg>
{% endif %}
